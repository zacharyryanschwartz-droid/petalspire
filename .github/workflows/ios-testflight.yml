name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/ios-testflight-da06

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Xcode
        run: xcodebuild -version

      - name: Build and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_SEED: ${{ secrets.APPLE_TEAM_SEED }}
        run: bash scripts/testflight.sh

      - name: Remove API key
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys"/AuthKey_*.p8 "$HOME/private_keys"/AuthKey_*.p8
